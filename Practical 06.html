<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="gradeForm" class="card" novalidate>
    <h2>Student Grade Calculator</h2>
    <label>Mathematics</label><input type="number" id="m1" placeholder="Marks out of 100">
    <label>Physics</label><input type="number" id="m2" placeholder="Marks out of 100">
    <label>Chemistry</label><input type="number" id="m3" placeholder="Marks out of 100">
    <label>English</label><input type="number" id="m4" placeholder="Marks out of 100">
    <label>Computer Science</label><input type="number" id="m5" placeholder="Marks out of 100">
    <button type="submit">Calculate</button>
    <div id="result"></div>
  </form>
  <script src="script.js"></script>
</body>
</html>
